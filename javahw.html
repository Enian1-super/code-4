<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        function findmax() {
            let i;
            let max = 0;
            for(i=0; i < arguments.length; i++) {
                if(arguments[i] > max) {
                    max = arguments[i];
                }
            }
            return max;
        }

        maxage = findmax(4, 19, 12, 65, 32);

        let person = {
            firstname: "Jack",  
        }

        document.getElementById("demo").innerHTML = person.firstname + "is the oldest person in the group. " + "He is " + maxage + " years old.";
    </script>
</body>
</html>
